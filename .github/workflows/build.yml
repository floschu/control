name: "build"

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version-file: .java-version
      - name: "lint"
        run: ./gradlew lint ktlintCheck

  test:
    runs-on: macos-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version-file: .java-version
      - name: "Test"
        run: ./gradlew test

  check_coverage:
    runs-on: macos-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version-file: .java-version
      - name: "Check if coverage is satisfied"
        run: ./gradlew koverVerify

  api_validation:
    runs-on: macos-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version-file: .java-version
      - name: "Validates the Api"
        run: ./gradlew apiCheck

  assemble:
    needs: [lint, test, check_coverage]
    runs-on: macos-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version-file: .java-version
      - name: "Assemble"
        run: ./gradlew assemble
