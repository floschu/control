name: "deploy release"

on:
  push:
    tags:
      - "*.*.*"

jobs:
  all_checks:
    runs-on: macos-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          distribution: "adopt"
          java-version-file: .java-version
      - name: "Checks all the things"
        run: ./gradlew lint ktlintCheck test koverVerify apiCheck assemble

  publish:
    needs: [ all_checks ]
    runs-on: macos-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Set up Java"
        uses: actions/setup-java@v5
        with:
          distribution: "adopt"
          java-version-file: .java-version
      - name: "Upload release"
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-parallel --no-configuration-cache
        env:
          libraryVersionTag: ${{ github.ref_name }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  github-release:
    needs: [ publish ]
    runs-on: ubuntu-latest
    steps:
      - name: "create GitHub release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
              --repo="${{ github.repository }}" \
              --title="$TAG" \
              --notes="See [CHANGELOG.md](https://github.com/floschu/control/blob/$TAG/CHANGELOG.md) for more details."
